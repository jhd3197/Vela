name: Build server downloads

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: python -m pip install -r requirements.txt -r scripts/requirements-build.txt
      - run: npm --prefix web ci
      - run: npm --prefix web run build
      - run: python -m unittest discover -s tests
      - run: node --test tests/bridge.test.mjs
      - run: python scripts/build-server.py
      - run: python scripts/test-server-bundle.py
      - uses: actions/upload-artifact@v4
        with:
          name: vela-server-${{ runner.os }}-${{ runner.arch }}
          path: .local/releases/*
          if-no-files-found: error
