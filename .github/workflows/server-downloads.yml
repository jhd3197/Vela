name: Release Vela Server

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 0.2.0). Leave blank for the next patch release.'
        required: false
        type: string

concurrency:
  group: vela-server-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    if: github.ref == 'refs/heads/main' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.release.outputs.version }}
      source: ${{ steps.release.outputs.source }}
      build_ref: ${{ steps.release.outputs.build_ref }}
      date: ${{ steps.release.outputs.date }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Choose a version or resume the same release
        id: release
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: python scripts/release.py prepare --version "$REQUESTED_VERSION"

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.build_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: python -m pip install -r requirements.txt -r scripts/requirements-build.txt
      - name: Stamp the same version into every platform build
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_DATE: ${{ needs.prepare.outputs.date }}
        shell: bash
        run: python scripts/release.py stamp --version "$RELEASE_VERSION" --date "$RELEASE_DATE"
      - run: npm --prefix web ci
      - run: npm --prefix web run build
      - run: python -m unittest discover -s tests
      - run: node --test tests/bridge.test.mjs
      - name: Install the automation runtime the download ships
        run: python scripts/setup-automation-worker.py
      - name: Install the agent desktop worker the download ships
        # The browser build itself is not packaged; the worker and its
        # provenance are, so the download can say which browser to fetch.
        run: python scripts/setup-browser-worker.py --skip-browser
      - name: Download the pinned Node runtime the download ships
        run: python scripts/fetch-node-runtime.py
      - run: python scripts/build-server.py
      - run: python scripts/test-server-bundle.py
      - name: Build the Windows installer
        if: runner.os == 'Windows'
        run: python scripts/build-windows-installer.py
      - name: Verify Windows tray, installer and uninstall
        if: runner.os == 'Windows'
        run: python scripts/test-windows-distribution.py
      - uses: actions/upload-artifact@v4
        with:
          name: vela-server-${{ runner.os }}-${{ runner.arch }}
          path: .local/releases/*
          if-no-files-found: error

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.build_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: vela-server-*
          merge-multiple: true
          path: .local/release-assets
      - name: Stamp the tested release metadata
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_DATE: ${{ needs.prepare.outputs.date }}
        run: python scripts/release.py stamp --version "$RELEASE_VERSION" --date "$RELEASE_DATE"
      - name: Tag and publish all tested executables
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_SOURCE: ${{ needs.prepare.outputs.source }}
        run: python scripts/release.py publish --version "$RELEASE_VERSION" --source "$RELEASE_SOURCE" --artifacts .local/release-assets
