name: Checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  hub:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: python -m pip install -r requirements.txt
      - run: npm --prefix web ci
      - run: npm --prefix web run check
      - name: Install Windows packaging dependencies
        if: runner.os == 'Windows'
        run: python -m pip install -r scripts/requirements-build.txt
      - name: Install the automation runtime the download ships
        if: runner.os == 'Windows'
        run: python scripts/setup-automation-worker.py
      - name: Download the pinned Node runtime the download ships
        if: runner.os == 'Windows'
        run: python scripts/fetch-node-runtime.py
      - name: Build and verify Windows downloads before merge
        if: runner.os == 'Windows'
        run: |
          python scripts/build-server.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/test-server-bundle.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/build-windows-installer.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/test-windows-distribution.py
